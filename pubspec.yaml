name: ytm_glass
description: YouTube Music client with liquid glass UI. No ads, no subscription.
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  permission_handler: ^11.3.1
  youtube_explode_dart: ^2.4.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  cached_network_image: ^3.4.1

flutter:
  uses-material-design: true
